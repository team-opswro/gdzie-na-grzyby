# Reguły gatunków. Jedyne miejsce z parametrami gatunkowymi.
# Kody drzew i siedlisk: ASCII, wielkie litery (normalizacja kodów BDL w pipeline).
# Modyfikatory siedliska (spec F): tabele kod BDL -> mnożnik (brak kodu = 1.0), rampa uszkodzeń (%),
# przedziały zadrzewienia [górna granica włącznie, mnożnik]. Gatunek może nadpisać całą tabelę w `factors:`.
# Iloczyn modyfikatorów ma dolne ograniczenie 0.4 (pipeline/habitat.py: MOD_FLOOR).
factors_default:
  veg: {ZAD: 0.7, ZIEL: 0.8, SZAD: 0.9}
  moist: {}  # zneutralizowany po walidacji (spec F §1): ablacja nie obniżała AUC
  degr: {N1: 1.0, N2: 1.0, Z1: 0.9, D1: 0.9, Z2: 0.8, Z3: 0.8, D2: 0.8, D3: 0.8, P: 0.8}
  soil: {}
  damage: {full: 40, zero_at: 100, min: 0.6}
  density: [[0.4, 0.8], [0.9, 1.0], [1.0, 0.9]]

# Zestawy siedlisk (spec K): element listy preferred/adjacent "@nazwa" rozwija się do kodów zestawu.
