# Reguły gatunków. Jedyne miejsce z parametrami gatunkowymi.
# Kody drzew i siedlisk: ASCII, wielkie litery (normalizacja kodów BDL w pipeline).
# Modyfikatory siedliska (spec F): tabele kod BDL -> mnożnik (brak kodu = 1.0), rampa uszkodzeń (%),
# przedziały zadrzewienia [górna granica włącznie, mnożnik]. Gatunek może nadpisać całą tabelę w `factors:`.
# Iloczyn modyfikatorów ma dolne ograniczenie 0.4 (pipeline/habitat.py: MOD_FLOOR).
factors_default:
  veg: {ZAD: 0.7, ZIEL: 0.8, SZAD: 0.9}
  moist: {}  # zneutralizowany po walidacji (spec F §1): ablacja nie obniżała AUC
  degr: {N1: 1.0, N2: 1.0, Z1: 0.9, D1: 0.9, Z2: 0.8, Z3: 0.8, D2: 0.8, D3: 0.8, P: 0.8}
  soil: {}
  damage: {full: 40, zero_at: 100, min: 0.6}
  density: [[0.4, 0.8], [0.9, 1.0], [1.0, 0.9]]
  # teren (spec I): klasa TWI wg tercyli obszaru i strome stoki południowe
  twi: {}
  exposure: {S_STEEP: 0.85, OTHER: 1.0}

# Wilgotność miejsca (spec L): surowa wartość = suma ważona składników 0–1, potem percentyl w obszarze
# (wet 0–100, mediana 50). Klient: w_eff = min(1, w · rain^(γ−1)), γ = G^(1 − 2·wet/100), G = wet_gamma
# gatunku (domyślnie 3). Walidacja GBIF (spec L §4): siedlisko, gleba, rowy i TWI obniżały AUC (dublują h),
# więc mają wagę 0 — liczone tylko diagnostycznie; zostaje bufor fizyczny: woda i obniżenie terenu.
water:
  weights: {water: 0.6, ditch: 0.0, valley: 0.4, habitat: 0.0, soil: 0.0, twi: 0.0}
  water_dist: [50, 500]   # m od krawędzi wydzielenia: 1.0 do pierwszej, liniowo do 0 przy drugiej
  ditch_dist: [20, 150]
  habitat_types:  # typ siedliskowy -> wartość (prefiks "@" = zestaw z habitat_sets); brak = default
    default: 0.2
    values:
      1.0: [OL, OLJ, OLJWYZ, OLJG, OLG, BB, BGB, BMB, BMGB, LMB, "@bory_bagienne", "@bory_mieszane_bagienne"]
      0.8: [LL, LLG, LLWYZ]
      0.6: ["@bory_wilgotne", "@bory_mieszane_wilgotne", "@lasy_mieszane_wilgotne", "@lasy_wilgotne"]
      0.1: [BSW, BGSW]
      0.0: [BS]
  moist_codes: {SU: 0.0, S: 0.2, SS: 0.2, WSW: 0.5, WW: 0.6, WO: 0.6, LN: 0.7, LP: 0.7, LZ: 0.9,
                BO: 1.0, BM: 1.0, BSO: 1.0, BBM: 1.0}
  soil_groups: {G: 1.0, OG: 1.0, OGS: 1.0, MR: 1.0, T: 1.0, M: 1.0, CZ: 1.0, MD: 0.7, AU: 0.7}
  soil_gleyed: 0.5   # "g" w podtypie gleby (oglejona, np. Bgms)

# Zestawy siedlisk (spec K): element listy preferred/adjacent "@nazwa" rozwija się do kodów zestawu.
habitat_sets:
  bory_ubogie: [BS, BSW, BGSW]
  bory_wilgotne: [BW, BWG, BGW]
  bory_bagienne: [BB, BGB]
  bory_mieszane_swieze: [BMSW, BMGSW]
  bory_mieszane_wilgotne: [BMW, BMWYZ, BMWYZSW, BMWYZW, BMGW]
  bory_mieszane_bagienne: [BMB, BMGB]
  lasy_mieszane_swieze: [LMSW, LMGSW, LMWYZ, LMWYZSW, LMG]
  lasy_mieszane_wilgotne: [LMW, LMGW, LMWYZW]
  lasy_swieze: [LSW, LWYZS, LWYZSW, LWYZ, LGSW, LG]
  lasy_wilgotne: [LW, LWYZW, LGW]

