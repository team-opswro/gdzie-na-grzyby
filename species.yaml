    season: {start: "07-01", end: "10-31"}
    temp: [6, 12, 20, 26]
    rain_min: 10
    rain_full: 40
    # spec L §1b: dąb, trawa, słońce — dąb premiowany, bez kary za zadarnienie i rzadki drzewostan
    partner_weights: {DB: 1.0, BK: 0.9, SO: 0.85, SW: 0.85}
    wet_gamma: 1.5  # spec L: słabszy efekt wilgotności miejsca (walidacja GBIF: G > 1.5 obniża AUC)
    factors:
      soil: {G: 0.85, OG: 0.85, MD: 0.85}
      veg: {}
      density: [[0.9, 1.0], [1.0, 0.9]]
