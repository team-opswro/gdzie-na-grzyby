server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # types w kontekście server zastępuje tabelę globalną, więc dołączamy mime.types.
    include /etc/nginx/mime.types;
    types { application/octet-stream pmtiles; }

    gzip on;
    gzip_types application/json text/css application/javascript;

    # Proxy danych z bucketu (/dane/), generowane przy starcie z DATA_BASE_URL (web-entrypoint).
    # Bez DATA_BASE_URL lub z DATA_DIRECT=1 katalog jest pusty — brak lokalizacji /dane/.
    include /etc/nginx/dane.d/*.conf;

    # Range (206) dla plików statycznych, w tym .pmtiles, działa domyślnie.
    location / {
        try_files $uri $uri/ =404;
    }

    # Regex wygrywa z zwykłym prefiksem, więc /vendor/ i /data/live/ mają ^~.
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Generowany przy starcie kontenera z DATA_BASE_URL.
    location = /config.json {
        add_header Cache-Control "no-cache";
    }

    location ^~ /data/live/ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(pmtiles)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
